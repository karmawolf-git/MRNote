<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 500px;
      height: 600px;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0a0f;
    }

    .banner {
      width: 500px;
      height: 600px;
      position: relative;
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── Background blobs ── */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.22;
    }
    .blob1 { width: 380px; height: 380px; background: #7c3aed; top: -80px; left: -80px; }
    .blob2 { width: 300px; height: 300px; background: #0ea5e9; bottom: -60px; right: -60px; }
    .blob3 { width: 240px; height: 240px; background: #f43f5e; bottom: 60px; left: -40px; opacity: 0.15; }

    /* ── Grid dots pattern ── */
    .dots {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    /* ── Content ── */
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      width: 100%;
      padding: 0 40px;
    }

    /* ── MR SVG Icon ── */
    .icon-wrap {
      margin-bottom: 28px;
      filter: drop-shadow(0 8px 32px rgba(124,58,237,0.5));
    }

    /* ── Title ── */
    .title {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(90deg, #a78bfa 0%, #38bdf8 50%, #fb7185 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      line-height: 1;
    }

    .subtitle {
      font-size: 15px;
      font-weight: 500;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 36px;
    }

    /* ── Divider ── */
    .divider {
      width: 48px;
      height: 3px;
      background: linear-gradient(90deg, #7c3aed, #0ea5e9);
      border-radius: 99px;
      margin-bottom: 36px;
    }

    /* ── Tag pills ── */
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 40px;
    }
    .tag {
      padding: 6px 16px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.75);
      background: rgba(255,255,255,0.05);
    }
    .tag.hl {
      background: linear-gradient(135deg, rgba(124,58,237,0.3), rgba(14,165,233,0.3));
      border-color: rgba(167,139,250,0.4);
      color: #c4b5fd;
    }

    /* ── Bottom bar ── */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: rgba(255,255,255,0.04);
      border-top: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      z-index: 3;
    }
    .bottom-left {
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.05em;
    }
    .bottom-right {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Corner accent ── */
    .corner-tr {
      position: absolute;
      top: 0; right: 0;
      width: 120px; height: 120px;
      background: linear-gradient(225deg, rgba(14,165,233,0.15), transparent);
      z-index: 1;
    }
    .corner-bl {
      position: absolute;
      bottom: 56px; left: 0;
      width: 100px; height: 100px;
      background: linear-gradient(45deg, rgba(244,63,94,0.1), transparent);
      z-index: 1;
    }
  </style>
</head>
<body>

      </svg>
    </div>

    <div class="title">MR Note</div>
    <div class="subtitle">Medical Representative Tools</div>
    <div class="divider"></div>

    <div class="tags">
      <span class="tag hl">💊 Drug Information</span>
      <span class="tag hl">📰 Medical News</span>

  <div class="bottom-bar">
